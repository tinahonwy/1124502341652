<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Notes</title>
<style>
  :root {
    --bg: #f6f4f1;
    --card: #ffffff;
    --text: #2b2a28;
    --muted: #8a857d;
    --line: #e6e1da;
    --accent: #7a8f7b;
    --accent-2: #c49a7a;
    --plus: #6f9a72;
    --minus: #c07070;
    --mid: #c9a85c;
    --danger: #b65c5c;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1b;
      --card: #262624;
      --text: #ebe7e1;
      --muted: #9a958d;
      --line: #3a3936;
      --accent: #9db39e;
      --accent-2: #d8b294;
      --plus: #8fbf92;
      --minus: #d98a8a;
      --mid: #d9bd7a;
      --danger: #d98080;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 80px; }
  .hidden { display: none !important; }

  #login {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 20px; padding: 16px;
  }
  #login h1 { font-weight: 600; letter-spacing: 0.05em; margin: 0; }
  #login p { color: var(--muted); margin: 0; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 20px; flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 1.4rem; font-weight: 600; }
  .user { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: var(--muted); }
  .user img { width: 28px; height: 28px; border-radius: 50%; }

  button {
    font: inherit; cursor: pointer; border: 1px solid var(--line);
    background: var(--card); color: var(--text);
    padding: 8px 14px; border-radius: 10px; transition: opacity .15s;
  }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.5; cursor: default; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.danger { color: var(--danger); }
  button.small { padding: 4px 10px; font-size: 0.85rem; }
  .google-btn { display: flex; align-items: center; gap: 10px; padding: 10px 18px; }

  nav { display: flex; gap: 2px; margin-bottom: 18px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  nav button {
    border: none; background: transparent; border-radius: 0; white-space: nowrap;
    padding: 10px 12px; color: var(--muted); border-bottom: 2px solid transparent;
  }
  nav button.active { color: var(--text); border-bottom-color: var(--accent); }

  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 18px; margin-bottom: 16px;
  }
  .card h2 { margin: 0 0 4px; font-size: 1.05rem; }
  .card .sub { color: var(--muted); font-size: 0.85rem; margin: 0 0 14px; }

  .field { display: block; font-size: 0.9rem; margin: 12px 0 6px; color: var(--muted); }
  .field:first-of-type { margin-top: 0; }
  input[type="date"], textarea {
    width: 100%; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px;
  }
  textarea { min-height: 90px; resize: vertical; }

  /* 加分 / 扣分 切換 */
  .sign-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .sign-toggle button { padding: 14px; font-size: 1rem; }
  .sign-toggle button.on-plus { background: var(--plus); border-color: var(--plus); color: #fff; }
  .sign-toggle button.on-minus { background: var(--minus); border-color: var(--minus); color: #fff; }

  /* 面向 chips */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button { padding: 5px 12px; font-size: 0.88rem; border-radius: 999px; }
  .chips button.on { background: var(--accent); color: #fff; border-color: var(--accent); }

  .chips button.add { border-style: dashed; color: var(--muted); }
  .chips button.tag.on { background: var(--accent-2); border-color: var(--accent-2); color: #fff; }
  .chips.managing button.tag::after { content: " ×"; color: var(--danger); }
  .link-btn { border: none; background: none; color: var(--muted); text-decoration: underline; padding: 0 0 0 8px; font-size: 0.8rem; }
  .tag-add { display: flex; gap: 8px; margin-top: 8px; }
  .tag-add input {
    flex: 1; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; min-width: 0;
  }
  .tagpill { font-size: 0.78rem; color: var(--accent-2); margin-right: 8px; }
  .filter.tags { flex-wrap: wrap; margin-top: -6px; }
  .filter.tags button.on { background: var(--accent-2); border-color: var(--accent-2); color: #fff; }

  /* 敘述題 */
  .dim-group { padding: 10px 0 4px; border-top: 1px dashed var(--line); }
  .dim-group:first-child { border-top: none; padding-top: 0; }
  .dim-title { font-weight: 600; font-size: 0.9rem; color: var(--accent); margin-bottom: 4px; }
  .stmt { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; }
  .stmt-text { flex: 1; font-size: 0.95rem; }
  .tri { display: flex; gap: 4px; flex-shrink: 0; }
  .tri input { display: none; }
  .tri label {
    padding: 4px 10px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 0.85rem; cursor: pointer; user-select: none;
  }
  .tri input[value="2"]:checked + label { background: var(--plus); border-color: var(--plus); color: #fff; }
  .tri input[value="1"]:checked + label { background: var(--mid); border-color: var(--mid); color: #fff; }
  .tri input[value="0"]:checked + label { background: var(--minus); border-color: var(--minus); color: #fff; }
  @media (max-width: 520px) {
    .stmt { flex-direction: column; align-items: stretch; gap: 6px; }
    .tri label { flex: 1; text-align: center; }
  }

  .slider-row { display: flex; align-items: center; gap: 14px; }
  input[type="range"] { flex: 1; accent-color: var(--accent-2); }
  .big-num { font-size: 1.6rem; font-weight: 600; min-width: 64px; text-align: right; color: var(--accent-2); }
  .scale-legend { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); margin-top: 4px; }

  .prompt-box {
    background: var(--bg); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px;
    display: flex; justify-content: space-between; gap: 10px; align-items: flex-start;
  }
  .prompt-text { font-weight: 500; }
  .hint { font-size: 0.85rem; color: var(--muted); background: var(--bg); border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; }

  .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 12px; }

  .baseline-toggle {
    display: flex; gap: 10px; align-items: flex-start; cursor: pointer;
    background: var(--bg); border-radius: 10px; padding: 10px 14px; margin: 10px 0 14px;
  }
  .baseline-toggle input { margin-top: 5px; accent-color: var(--accent-2); }
  .baseline-toggle small { display: block; color: var(--muted); font-size: 0.8rem; }
  .pill.base { background: var(--accent-2); color: #fff; border-color: var(--accent-2); }
  .delta-up { color: var(--plus); }
  .delta-down { color: var(--minus); }
  .stat .d { font-size: 0.78rem; }

  /* 列表 */
  .filter { display: flex; gap: 8px; margin-bottom: 14px; }
  .filter button { padding: 4px 12px; font-size: 0.88rem; border-radius: 999px; }
  .filter button.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .entry { cursor: pointer; }
  .entry-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .entry-date { font-weight: 600; }
  .pill {
    font-size: 0.8rem; padding: 2px 10px; border-radius: 999px;
    background: var(--bg); border: 1px solid var(--line); white-space: nowrap;
  }
  .sign { display: inline-flex; width: 22px; height: 22px; border-radius: 50%; align-items: center; justify-content: center;
    color: #fff; font-size: 0.9rem; font-weight: 700; margin-right: 8px; vertical-align: middle; }
  .sign.plus { background: var(--plus); }
  .sign.minus { background: var(--minus); }
  .ev-text { margin-top: 6px; white-space: pre-wrap; }
  .entry-preview { color: var(--muted); font-size: 0.9rem; margin-top: 6px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry-detail { margin-top: 12px; font-size: 0.92rem; }
  .entry-detail .row { display: flex; justify-content: space-between; padding: 3px 0; }
  .entry-detail .block { margin-top: 10px; white-space: pre-wrap; }
  .entry-detail .block b { display: block; color: var(--muted); font-weight: 500; font-size: 0.85rem; }
  .watch { margin: 4px 0 0; padding-left: 18px; }
  .watch li { margin: 2px 0; }
  .mini-list .entry { padding: 12px 16px; margin-bottom: 8px; }

  /* 趨勢 */
  svg text { fill: var(--muted); font-size: 11px; }
  .legend { display: flex; gap: 16px; font-size: 0.85rem; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
  .legend .l1::before { background: var(--accent-2); }
  .legend .l2::before { background: var(--accent); }
  .bar-row { margin: 14px 0; }
  .bar-label { display: flex; justify-content: space-between; font-size: 0.88rem; gap: 8px; }
  .bar-track { height: 8px; background: var(--bg); border-radius: 4px; position: relative; margin-top: 4px; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 4px; }
  .bar-recent { position: absolute; top: -3px; width: 3px; height: 14px; background: var(--accent-2); border-radius: 2px; }
  .ev-count { font-size: 0.8rem; }
  .ev-count .p { color: var(--plus); }
  .ev-count .m { color: var(--minus); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { text-align: center; background: var(--bg); border-radius: 10px; padding: 12px 6px; }
  .stat .n { font-size: 1.4rem; font-weight: 600; }
  .stat .t { font-size: 0.8rem; color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 24px 0; }

  #cover {
    position: fixed; inset: 0; background: var(--bg); z-index: 999;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); cursor: pointer;
  }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 10px;
    font-size: 0.9rem; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 1000;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="cover" class="hidden">暫無內容</div>

<section id="login" class="hidden">
  <h1>Notes</h1>
  <p>Sign in to continue</p>
  <button class="google-btn" id="loginBtn">
    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
    使用 Google 登入
  </button>
</section>

<main id="app" class="wrap hidden">
  <header>
    <h1>Notes</h1>
    <div class="user">
      <button class="small" id="hideBtn" title="快速隱藏（Esc）">隱藏</button>
      <img id="avatar" alt="" />
      <span id="userName"></span>
      <button class="small" id="logoutBtn">登出</button>
    </div>
  </header>

  <nav>
    <button data-tab="event" class="active">記一筆</button>
    <button data-tab="checkin">定期檢查</button>
    <button data-tab="history">歷史</button>
    <button data-tab="trend">趨勢</button>
  </nav>

  <!-- ===== 記一筆 ===== -->
  <section id="tab-event">
    <div class="card">
      <h2 id="evTitle">發生了什麼？</h2>
      <p class="sub">有讓你更確定或更猶豫的事，隨手記下來就好。</p>

      <div class="sign-toggle">
        <button id="evPlus">＋ 加分</button>
        <button id="evMinus">－ 扣分</button>
      </div>

      <label class="field">跟哪方面有關（可不選）</label>
      <div class="chips" id="evDims"></div>

      <div class="field">我的標籤（可複選）<button class="small link-btn" id="tagManage">管理</button></div>
      <div class="chips" id="evTags"></div>
      <div class="tag-add hidden" id="tagAddRow">
        <input type="text" id="tagInput" maxlength="12" placeholder="新標籤，例如：他的工作、旅行" />
        <button class="small primary" id="tagAddOk">新增</button>
        <button class="small" id="tagAddCancel">取消</button>
      </div>

      <label class="field" for="evText">簡單描述</label>
      <textarea id="evText" placeholder="例如：我累的時候他主動把晚餐處理好"></textarea>

      <label class="field" for="evDate">日期</label>
      <input type="date" id="evDate" />

      <div class="actions">
        <button id="evCancel" class="hidden">取消編輯</button>
        <button class="primary" id="evSave">記下來</button>
      </div>
    </div>

    <div class="card">
      <h2>最近記下的</h2>
      <div class="mini-list" id="recentEvents"></div>
    </div>
  </section>

  <!-- ===== 定期檢查 ===== -->
  <section id="tab-checkin" class="hidden">
    <div class="hint" id="lastCheckinHint"></div>

    <div class="card">
      <h2 id="ckTitle">最近這段時間</h2>
      <label class="baseline-toggle">
        <input type="checkbox" id="ckBaseline" />
        <span>設為起點<small>之後的變化都跟這次比較。建議挑情緒平穩的日子做。</small></span>
      </label>
      <p class="sub" id="ckSub"></p>
      <div id="stmts"></div>
    </div>

    <div class="card">
      <h2>我自己</h2>
      <p class="sub">撇開他好不好，此刻的「我」想不想走進這個決定？</p>
      <div class="slider-row">
        <input type="range" id="willing" min="0" max="100" step="5" value="50" />
        <div class="big-num" id="willingVal">50</div>
      </div>
      <div class="scale-legend"><span>完全不想</span><span>還不確定</span><span>非常想</span></div>
    </div>

    <div class="card">
      <h2>反思一題</h2>
      <div class="prompt-box">
        <div class="prompt-text" id="promptText"></div>
        <button class="small" id="shuffleBtn">換一題</button>
      </div>
      <textarea id="reflection" placeholder="寫下第一個浮現的想法…"></textarea>
    </div>

    <div class="card">
      <h2>其他筆記</h2>
      <textarea id="notes" placeholder="這段時間整體的感覺？"></textarea>
      <label class="field" for="ckDate">日期</label>
      <input type="date" id="ckDate" />
      <div class="actions">
        <button id="ckCancel" class="hidden">取消編輯</button>
        <button class="primary" id="ckSave">儲存</button>
      </div>
    </div>
  </section>

  <!-- ===== 歷史 ===== -->
  <section id="tab-history" class="hidden">
    <div class="filter" id="histFilter">
      <button data-f="all" class="on">全部</button>
      <button data-f="event">加減分</button>
      <button data-f="checkin">檢查</button>
    </div>
    <div class="filter tags" id="histTags"></div>
    <div id="historyList"></div>
  </section>

  <!-- ===== 趨勢 ===== -->
  <section id="tab-trend" class="hidden">
    <div id="trendContent"></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, setDoc,
    query, orderBy, onSnapshot, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBxlFMibr98Jpu14fOkoEtPDIDoIW4k1mQ",
    authDomain: "tina-ca848.firebaseapp.com",
    projectId: "tina-ca848",
    storageBucket: "tina-ca848.firebasestorage.app",
    messagingSenderId: "563391275176",
    appId: "1:563391275176:web:fc671772bf6c32b935e29d"
  };

  const fb = initializeApp(firebaseConfig);
  const auth = getAuth(fb);
  const db = getFirestore(fb);

  // ---------- 面向與敘述 ----------
  const DIMENSIONS = [
    { key: "values", name: "價值觀" },
    { key: "comm",   name: "溝通" },
    { key: "money",  name: "金錢" },
    { key: "family", name: "家庭" },
    { key: "daily",  name: "日常生活" },
    { key: "future", name: "未來規劃" },
    { key: "trust",  name: "安全感" },
    { key: "self",   name: "我自己" }
  ];
  const DIM_NAME = Object.fromEntries(DIMENSIONS.map(d => [d.key, d.name]));
  DIM_NAME.other = "其他";

  // 2 = 是, 1 = 有點, 0 = 不是（全部用「是」= 好的方向來寫）
  const STATEMENTS = [
    { id: "v1", dim: "values", text: "對重要的事（怎麼過生活、什麼值得在乎），我們想法接近" },
    { id: "v2", dim: "values", text: "我不需要藏起真正的想法來避免衝突" },
    { id: "c1", dim: "comm",   text: "意見不合後，我們有好好和好，不是冷處理或不了了之" },
    { id: "c2", dim: "comm",   text: "我說出自己的需要時，他有聽進去" },
    { id: "m1", dim: "money",  text: "談到錢的事，我不會想迴避" },
    { id: "m2", dim: "money",  text: "他花錢、存錢的方式讓我安心" },
    { id: "f1", dim: "family", text: "想到跟他的家人相處，我不會緊繃" },
    { id: "f2", dim: "family", text: "家人介入我們的事時，他會站在我們這邊處理" },
    { id: "d1", dim: "daily",  text: "一起相處的日常（作息、習慣）沒有讓我累積不滿" },
    { id: "d2", dim: "daily",  text: "家事和照顧的事，分配起來感覺公平" },
    { id: "u1", dim: "future", text: "小孩、住哪裡、工作這些大方向，我們談過而且方向接近" },
    { id: "u2", dim: "future", text: "想到跟他的五年後，期待多於擔心" },
    { id: "t1", dim: "trust",  text: "在他身邊，我可以放鬆做自己" },
    { id: "t2", dim: "trust",  text: "我相信他說的話，不需要去確認" },
    { id: "s1", dim: "self",   text: "在這段關係裡，我還喜歡自己的樣子" },
    { id: "s2", dim: "self",   text: "我的朋友、興趣、工作沒有因為這段關係被壓縮" }
  ];
  const ANSWER_LABEL = { 2: "是", 1: "有點", 0: "不是" };

  const PROMPTS = [
    "如果完全不考慮任何人的期待，我想要嗎？",
    "我想走這一步，是為了得到什麼？",
    "我最害怕的是什麼？那個害怕是關於他，還是關於這件事本身？",
    "五年後的平常週二晚上，我希望自己在過什麼樣的生活？",
    "如果維持現狀不改變，我會覺得可惜還是鬆一口氣？",
    "最近一次讓我心裡一沉的時刻是什麼？",
    "最近一次讓我覺得「就是他」的時刻是什麼？",
    "有哪件事我一直沒跟他說？為什麼？",
    "我對這件事的猶豫，有多少來自過去的經驗或原生家庭？",
    "如果好朋友處在我的位置，我會給她什麼建議？",
    "我能接受他現在的樣子一輩子都不改變嗎？",
    "我是想跟「他」在一起，還是想要「一個穩定的狀態」？",
    "這段關係讓我變得更勇敢，還是更小心翼翼？",
    "什麼事情發生的話，我會很確定答案是「不」？"
  ];

  // ---------- 工具 ----------
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
  const today = () => new Date().toLocaleDateString("sv");
  const daysAgo = (n) => { const d = new Date(); d.setDate(d.getDate() - n); return d.toLocaleDateString("sv"); };
  const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);

  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1800);
  }

  const loginEl = $("login"), appEl = $("app"), coverEl = $("cover");
  let entriesUnsub = null;
  let entries = [];
  let histFilter = "all";

  const isEvent = e => e.type === "event";
  const isCheckin = e => e.type !== "event"; // 舊資料沒有 type，視為檢查

  // 單一面向分數（0–100），舊資料的 1–5 分也換算進來
  function dimScore(e, key) {
    if (e.answers) {
      const vals = STATEMENTS.filter(s => s.dim === key)
        .map(s => e.answers[s.id]).filter(v => v !== undefined && v !== null);
      if (vals.length) return vals.reduce((a, b) => a + b, 0) / vals.length / 2 * 100;
    }
    const old = e.scores?.[key];
    return old ? (old - 1) / 4 * 100 : null;
  }
  function relAvg(e) {
    const v = DIMENSIONS.map(d => dimScore(e, d.key)).filter(x => x !== null);
    return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
  }
  // 起點：最新一筆標記為起點的檢查
  function getBaseline() {
    return sortDesc(entries.filter(e => isCheckin(e) && e.baseline))[0] || null;
  }
  function deltaHtml(now, base) {
    if (now === null || base === null || now === undefined || base === undefined) return "";
    const d = Math.round(now - base);
    if (d === 0) return `<span>（與起點持平）</span>`;
    return `<span class="${d > 0 ? "delta-up" : "delta-down"}">（比起點 ${d > 0 ? "＋" : "－"}${Math.abs(d)}）</span>`;
  }
  function ratioText(p, m) {
    if (!p && !m) return "還沒有紀錄";
    if (!m) return "目前沒有扣分";
    if (!p) return "目前只有扣分";
    const r = p / m;
    return r >= 1 ? `約 ${r.toFixed(1)} 比 1` : `約 1 比 ${(m / p).toFixed(1)}（扣分較多）`;
  }

  function sortDesc(list) {
    return [...list].sort((a, b) =>
      b.date.localeCompare(a.date) ||
      ((b.createdAt?.seconds ?? Infinity) - (a.createdAt?.seconds ?? Infinity)));
  }

  // 讓 radio 再點一次可以取消
  function makeUnselectable(container) {
    container.querySelectorAll("input[type=radio]").forEach(inp => {
      inp.addEventListener("click", function () {
        if (this.dataset.was === "1") { this.checked = false; this.dataset.was = "0"; }
        else {
          container.querySelectorAll(`input[name="${this.name}"]`).forEach(o => o.dataset.was = "0");
          this.dataset.was = "1";
        }
      });
    });
  }

  // =========================================================
  // 記一筆
  // =========================================================
  let evSign = null, evDim = null, evEditingId = null;

  // ---------- 自訂標籤 ----------
  let customTags = [];          // 存在 users/{uid}/settings/tags
  let evTags = new Set();
  let tagManaging = false;
  let tagsUnsub = null;
  const tagsRef = () => doc(db, "users", auth.currentUser.uid, "settings", "tags");

  function renderTagChips() {
    const box = $("evTags");
    box.classList.toggle("managing", tagManaging);
    box.innerHTML =
      customTags.map(t => `<button class="tag ${evTags.has(t) ? "on" : ""}" data-t="${esc(t)}">${esc(t)}</button>`).join("") +
      (tagManaging ? "" : `<button class="add" data-add="1">＋ 新增標籤</button>`);
    $("tagManage").textContent = tagManaging ? "完成" : "管理";
    $("tagManage").classList.toggle("hidden", !customTags.length && !tagManaging);
  }
  async function saveTags(list) {
    try { await setDoc(tagsRef(), { list }, { merge: true }); }
    catch (err) { console.error(err); toast("標籤儲存失敗：" + err.code); }
  }
  async function addTag() {
    const t = $("tagInput").value.trim().replace(/\s+/g, " ");
    if (!t) return;
    if (!customTags.includes(t)) await saveTags([...customTags, t]);
    evTags.add(t);
    $("tagInput").value = "";
    $("tagAddRow").classList.add("hidden");
    renderTagChips();
  }
  function buildTagUI() {
    $("evTags").addEventListener("click", async ev => {
      const b = ev.target.closest("button"); if (!b) return;
      if (b.dataset.add) {
        $("tagAddRow").classList.remove("hidden");
        $("tagInput").focus();
        return;
      }
      const t = b.dataset.t;
      if (tagManaging) {
        if (!confirm(`刪除標籤「${t}」？\n已經記下的紀錄會保留這個標籤。`)) return;
        evTags.delete(t);
        await saveTags(customTags.filter(x => x !== t));
        return;
      }
      evTags.has(t) ? evTags.delete(t) : evTags.add(t);
      renderTagChips();
    });
    $("tagManage").addEventListener("click", () => { tagManaging = !tagManaging; renderTagChips(); });
    $("tagAddOk").addEventListener("click", addTag);
    $("tagInput").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); addTag(); } });
    $("tagAddCancel").addEventListener("click", () => { $("tagInput").value = ""; $("tagAddRow").classList.add("hidden"); });
  }
  // 歷史 / 趨勢會用到的：所有出現過的標籤
  function allUsedTags() {
    const s = new Set(customTags);
    entries.forEach(e => (e.tags || []).forEach(t => s.add(t)));
    return [...s];
  }

  function buildEventForm() {
    $("evDims").innerHTML = [...DIMENSIONS, { key: "other", name: "其他" }]
      .map(d => `<button data-k="${d.key}">${d.name}</button>`).join("");
    $("evDims").addEventListener("click", ev => {
      const b = ev.target.closest("button"); if (!b) return;
      evDim = evDim === b.dataset.k ? null : b.dataset.k;
      paintEventForm();
    });
    $("evPlus").addEventListener("click", () => { evSign = evSign === 1 ? null : 1; paintEventForm(); });
    $("evMinus").addEventListener("click", () => { evSign = evSign === -1 ? null : -1; paintEventForm(); });
    $("evSave").addEventListener("click", saveEvent);
    $("evCancel").addEventListener("click", resetEvent);
  }
  function paintEventForm() {
    $("evPlus").className = evSign === 1 ? "on-plus" : "";
    $("evMinus").className = evSign === -1 ? "on-minus" : "";
    $("evDims").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.k === evDim));
  }
  function resetEvent() {
    evSign = null; evDim = null; evEditingId = null;
    evTags = new Set(); renderTagChips();
    $("evText").value = ""; $("evDate").value = today();
    $("evTitle").textContent = "發生了什麼？";
    $("evCancel").classList.add("hidden");
    $("evSave").textContent = "記下來";
    paintEventForm();
  }
  function fillEvent(e) {
    evSign = e.sign; evDim = e.dim || null; evEditingId = e.id;
    evTags = new Set(e.tags || []); renderTagChips();
    $("evText").value = e.text || ""; $("evDate").value = e.date;
    $("evTitle").textContent = `編輯 ${e.date} 的事件`;
    $("evCancel").classList.remove("hidden");
    $("evSave").textContent = "更新";
    paintEventForm();
    switchTab("event");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  async function saveEvent() {
    if (!evSign) { toast("先選加分或扣分"); return; }
    if (!$("evText").value.trim()) { toast("簡單寫一下發生什麼事"); return; }
    const data = {
      type: "event",
      sign: evSign,
      dim: evDim || "other",
      tags: [...evTags],
      text: $("evText").value.trim(),
      date: $("evDate").value || today()
    };
    if (await saveEntry(data, evEditingId, $("evSave"))) resetEvent();
  }

  // =========================================================
  // 定期檢查
  // =========================================================
  let ckEditingId = null, currentPrompt = "";

  function buildCheckinForm() {
    $("stmts").innerHTML = DIMENSIONS.map(d => `
      <div class="dim-group">
        <div class="dim-title">${d.name}</div>
        ${STATEMENTS.filter(s => s.dim === d.key).map(s => `
          <div class="stmt">
            <div class="stmt-text">${s.text}</div>
            <div class="tri">
              ${[2, 1, 0].map(v => `
                <input type="radio" name="st-${s.id}" id="st-${s.id}-${v}" value="${v}">
                <label for="st-${s.id}-${v}">${ANSWER_LABEL[v]}</label>`).join("")}
            </div>
          </div>`).join("")}
      </div>`).join("");
    makeUnselectable($("stmts"));
    $("willing").addEventListener("input", e => $("willingVal").textContent = e.target.value);
    $("shuffleBtn").addEventListener("click", newPrompt);
    $("ckSave").addEventListener("click", saveCheckin);
    $("ckCancel").addEventListener("click", resetCheckin);
    $("ckBaseline").addEventListener("change", () => { baselineTouched = true; paintBaselineText(); });
  }
  let baselineTouched = false;
  function paintBaselineText() {
    $("ckSub").textContent = $("ckBaseline").checked
      ? "這次是起點：想想「整體來說，這段關係平常是怎樣」，不要只看最近發生的事。回答「是／有點／不是」，不確定就跳過。"
      : "想想最近一兩週，回答「是／有點／不是」。沒遇到的情況就跳過，再點一次可以取消。";
  }
  // 還沒有起點時，預設勾選
  function syncBaselineDefault() {
    if (ckEditingId || baselineTouched) return;
    $("ckBaseline").checked = !getBaseline();
    paintBaselineText();
  }
  function newPrompt() {
    let p;
    do { p = PROMPTS[Math.floor(Math.random() * PROMPTS.length)]; }
    while (p === currentPrompt && PROMPTS.length > 1);
    currentPrompt = p;
    $("promptText").textContent = p;
  }
  function clearStmts() {
    $("stmts").querySelectorAll("input").forEach(i => { i.checked = false; i.dataset.was = "0"; });
  }
  function resetCheckin() {
    ckEditingId = null;
    clearStmts();
    $("willing").value = 50; $("willingVal").textContent = 50;
    $("reflection").value = ""; $("notes").value = "";
    $("ckDate").value = today();
    $("ckTitle").textContent = "最近這段時間";
    $("ckCancel").classList.add("hidden");
    baselineTouched = false;
    syncBaselineDefault();
    newPrompt();
  }
  function fillCheckin(e) {
    ckEditingId = e.id;
    clearStmts();
    Object.entries(e.answers || {}).forEach(([id, v]) => {
      const el = $(`st-${id}-${v}`);
      if (el) { el.checked = true; el.dataset.was = "1"; }
    });
    $("willing").value = e.willing ?? 50; $("willingVal").textContent = e.willing ?? 50;
    currentPrompt = e.prompt || PROMPTS[0];
    $("promptText").textContent = currentPrompt;
    $("reflection").value = e.reflection || "";
    $("notes").value = e.notes || "";
    $("ckDate").value = e.date;
    $("ckBaseline").checked = !!e.baseline;
    paintBaselineText();
    $("ckTitle").textContent = `編輯 ${e.date} 的檢查`;
    $("ckCancel").classList.remove("hidden");
    switchTab("checkin");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  async function saveCheckin() {
    const answers = {};
    STATEMENTS.forEach(s => {
      const c = document.querySelector(`input[name="st-${s.id}"]:checked`);
      if (c) answers[s.id] = Number(c.value);
    });
    const data = {
      type: "checkin",
      baseline: $("ckBaseline").checked,
      answers,
      willing: Number($("willing").value),
      prompt: currentPrompt,
      reflection: $("reflection").value.trim(),
      notes: $("notes").value.trim(),
      date: $("ckDate").value || today()
    };
    if (await saveEntry(data, ckEditingId, $("ckSave"))) resetCheckin();
  }

  // =========================================================
  // 共用儲存 / 刪除
  // =========================================================
  async function saveEntry(data, editingId, btn) {
    const user = auth.currentUser;
    if (!user) return false;
    const col = collection(db, "users", user.uid, "entries");
    btn.disabled = true;
    try {
      if (editingId) {
        await updateDoc(doc(col, editingId), { ...data, updatedAt: serverTimestamp() });
        toast("已更新");
      } else {
        await addDoc(col, { ...data, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
        toast("已儲存");
      }
      return true;
    } catch (err) {
      console.error(err);
      toast("儲存失敗：" + err.code);
      return false;
    } finally {
      btn.disabled = false;
    }
  }
  async function removeEntry(id) {
    if (!confirm("確定要刪除這筆紀錄嗎？")) return;
    try {
      await deleteDoc(doc(db, "users", auth.currentUser.uid, "entries", id));
      toast("已刪除");
    } catch (err) { toast("刪除失敗：" + err.code); }
  }

  // =========================================================
  // 卡片
  // =========================================================
  const actionsHtml = `
    <div class="actions">
      <button class="small" data-act="edit">編輯</button>
      <button class="small danger" data-act="del">刪除</button>
    </div>`;

  function eventCard(e) {
    const plus = e.sign === 1;
    return `
      <div class="card entry" data-id="${esc(e.id)}">
        <div class="entry-top">
          <span><span class="sign ${plus ? "plus" : "minus"}">${plus ? "＋" : "－"}</span><span class="entry-date">${esc(e.date)}</span></span>
          <span class="pill">${esc(DIM_NAME[e.dim] || "其他")}</span>
        </div>
        <div class="ev-text">${esc(e.text)}</div>
        ${(e.tags || []).length ? `<div style="margin-top:4px">${e.tags.map(t => `<span class="tagpill">#${esc(t)}</span>`).join("")}</div>` : ""}
        <div class="entry-detail hidden">${actionsHtml}</div>
      </div>`;
  }

  function checkinCard(e) {
    const a = relAvg(e);
    const preview = e.notes || e.reflection || "";
    const dimRows = DIMENSIONS.map(d => {
      const s = dimScore(e, d.key);
      return s === null ? "" : `<div class="row"><span>${d.name}</span><span>${Math.round(s)}</span></div>`;
    }).join("");
    const watch = STATEMENTS.filter(s => e.answers && e.answers[s.id] !== undefined && e.answers[s.id] < 2)
      .map(s => `<li>${e.answers[s.id] === 0 ? "不是" : "有點"}：${s.text}</li>`).join("");
    return `
      <div class="card entry" data-id="${esc(e.id)}">
        <div class="entry-top">
          <span class="entry-date">${esc(e.date)} 檢查</span>
          <span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
            ${e.baseline ? `<span class="pill base">起點</span>` : ""}
            <span class="pill">意願 ${e.willing ?? "-"}</span>
            <span class="pill">關係 ${a !== null ? Math.round(a) : "-"}</span>
          </span>
        </div>
        ${preview ? `<div class="entry-preview">${esc(preview)}</div>` : ""}
        <div class="entry-detail hidden">
          ${dimRows}
          ${watch ? `<div class="block"><b>需要留意</b><ul class="watch">${watch}</ul></div>` : ""}
          ${e.reflection ? `<div class="block"><b>${esc(e.prompt)}</b>${esc(e.reflection)}</div>` : ""}
          ${e.notes ? `<div class="block"><b>筆記</b>${esc(e.notes)}</div>` : ""}
          ${actionsHtml}
        </div>
      </div>`;
  }

  function cardFor(e) { return isEvent(e) ? eventCard(e) : checkinCard(e); }

  function handleCardClick(ev) {
    const card = ev.target.closest(".entry");
    if (!card) return;
    const e = entries.find(x => x.id === card.dataset.id);
    if (!e) return;
    const act = ev.target.dataset.act;
    if (act === "edit") { isEvent(e) ? fillEvent(e) : fillCheckin(e); return; }
    if (act === "del") { removeEntry(e.id); return; }
    card.querySelector(".entry-detail").classList.toggle("hidden");
  }
  $("historyList").addEventListener("click", handleCardClick);
  $("recentEvents").addEventListener("click", handleCardClick);

  // =========================================================
  // 畫面渲染
  // =========================================================
  function renderRecent() {
    const ev = sortDesc(entries.filter(isEvent)).slice(0, 5);
    $("recentEvents").innerHTML = ev.length ? ev.map(eventCard).join("") : `<div class="empty">還沒有記錄</div>`;
  }

  function renderCheckinHint() {
    const last = sortDesc(entries.filter(isCheckin))[0];
    const since = last ? entries.filter(e => isEvent(e) && e.date > last.date) : entries.filter(isEvent);
    const p = since.filter(e => e.sign === 1).length, m = since.filter(e => e.sign === -1).length;
    const base = getBaseline();
    if (!last) {
      $("lastCheckinHint").textContent = "第一次檢查會設為起點，之後的變化都跟它比。大概 3 分鐘，挑情緒平穩的時候做。";
    } else {
      const d = daysBetween(last.date, today());
      $("lastCheckinHint").textContent =
        `上次檢查是 ${d === 0 ? "今天" : d + " 天前"}（${last.date}）。之後記了 ${p} 個加分、${m} 個扣分。` +
        (base ? `　起點：${base.date}` : "　還沒有設定起點。");
    }
    syncBaselineDefault();
  }

  let histTag = null;
  function renderHistory() {
    const tags = allUsedTags();
    if (histTag && !tags.includes(histTag)) histTag = null;
    $("histTags").innerHTML = tags.length
      ? tags.map(t => `<button data-t="${esc(t)}" class="${t === histTag ? "on" : ""}">#${esc(t)}</button>`).join("")
      : "";
    const list = sortDesc(entries.filter(e =>
      (histFilter === "all" || (histFilter === "event" ? isEvent(e) : isCheckin(e))) &&
      (!histTag || (e.tags || []).includes(histTag))));
    $("historyList").innerHTML = list.length ? list.map(cardFor).join("") : `<div class="empty">還沒有紀錄</div>`;
  }
  $("histFilter").addEventListener("click", ev => {
    const b = ev.target.closest("button"); if (!b) return;
    histFilter = b.dataset.f;
    $("histFilter").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    renderHistory();
  });
  $("histTags").addEventListener("click", ev => {
    const b = ev.target.closest("button"); if (!b) return;
    histTag = histTag === b.dataset.t ? null : b.dataset.t;
    renderHistory();
  });

  function renderTrend() {
    const box = $("trendContent");
    const checks = [...entries.filter(isCheckin)].sort((a, b) => a.date.localeCompare(b.date));
    const events = entries.filter(isEvent);
    if (!checks.length && !events.length) {
      box.innerHTML = `<div class="empty">累積一些紀錄後，這裡會出現變化</div>`;
      return;
    }

    const cutoff = daysAgo(30);
    const ev30 = events.filter(e => e.date >= cutoff);
    const p30 = ev30.filter(e => e.sign === 1).length;
    const m30 = ev30.filter(e => e.sign === -1).length;

    const n = checks.length;
    const base = getBaseline();
    const baseW = base ? (base.willing ?? null) : null;
    const baseRel = base ? relAvg(base) : null;
    // 「最近」＝起點之後的最近 3 次（不含起點本身與更早的紀錄）
    const recent = checks.filter(e => e !== base && (!base || e.date >= base.date)).slice(-3);
    const recW = recent.length ? recent.reduce((s, e) => s + (e.willing ?? 0), 0) / recent.length : null;
    const recRelVals = recent.map(relAvg).filter(v => v !== null);
    const recRel = recRelVals.length ? recRelVals.reduce((a, b) => a + b, 0) / recRelVals.length : null;

    // 折線圖
    let chart = `<div class="empty">做過兩次以上的定期檢查，就會出現曲線</div>`;
    if (n >= 2) {
      const W = 640, H = 220, P = 30;
      const x = i => P + i * (W - 2 * P) / (n - 1);
      const y = v => H - P - v * (H - 2 * P) / 100;
      const ptsW = checks.map((e, i) => `${x(i)},${y(e.willing ?? 0)}`).join(" ");
      const rel = checks.map((e, i) => { const a = relAvg(e); return a !== null ? [x(i), y(a)] : null; }).filter(Boolean);
      const grid = [0, 50, 100].map(v => `
        <line x1="${P}" x2="${W - P}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="3 4"/>
        <text x="4" y="${y(v) + 4}">${v}</text>`).join("");
      const every = Math.max(1, Math.ceil(n / 6));
      const xl = checks.map((e, i) => i % every === 0 || i === n - 1
        ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(e.date.slice(5))}</text>` : "").join("");
      const baseLines =
        (baseW !== null ? `<line x1="${P}" x2="${W - P}" y1="${y(baseW)}" y2="${y(baseW)}" stroke="var(--accent-2)" stroke-dasharray="6 5" opacity="0.6"/>` : "") +
        (baseRel !== null ? `<line x1="${P}" x2="${W - P}" y1="${y(baseRel)}" y2="${y(baseRel)}" stroke="var(--accent)" stroke-dasharray="6 5" opacity="0.6"/>` : "");
      chart = `
        <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="趨勢圖">
          ${grid}
          ${baseLines}
          ${rel.length > 1 ? `<polyline points="${rel.map(p => p.join(",")).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2" opacity="0.8"/>` : ""}
          <polyline points="${ptsW}" fill="none" stroke="var(--accent-2)" stroke-width="2.5"/>
          ${rel.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--accent)"/>`).join("")}
          ${checks.map((e, i) => `<circle cx="${x(i)}" cy="${y(e.willing ?? 0)}" r="3.5" fill="var(--accent-2)"/>`).join("")}
          ${xl}
        </svg>
        <div class="legend"><span class="l1">我自己的意願</span><span class="l2">關係分數（檢查平均）</span>${base ? `<span style="padding-left:0">虛線＝起點</span>` : ""}</div>`;
    }

    // 各面向
    // 每個面向：長條＝最近（沒有就用起點），橘色標記＝起點
    const rows = DIMENSIONS.map(d => {
      const rec = recent.map(e => dimScore(e, d.key)).filter(v => v !== null);
      const ravg = rec.length ? rec.reduce((a, b) => a + b, 0) / rec.length : null;
      const bval = base ? dimScore(base, d.key) : null;
      const shown = ravg ?? bval;
      const dp = ev30.filter(e => e.dim === d.key && e.sign === 1).length;
      const dm = ev30.filter(e => e.dim === d.key && e.sign === -1).length;
      if (shown === null && !dp && !dm) return "";
      return `
        <div class="bar-row">
          <div class="bar-label">
            <span>${d.name}</span>
            <span>
              ${dp || dm ? `<span class="ev-count"><span class="p">＋${dp}</span> <span class="m">－${dm}</span></span> · ` : ""}
              ${shown !== null ? Math.round(shown) : ""}
              ${ravg !== null && bval !== null ? deltaHtml(ravg, bval) : (ravg === null && bval !== null ? "<span>（起點）</span>" : "")}
            </span>
          </div>
          ${shown !== null ? `<div class="bar-track">
            <div class="bar-fill" style="width:${shown}%"></div>
            ${bval !== null && ravg !== null ? `<div class="bar-recent" style="left:calc(${bval}% - 1.5px)"></div>` : ""}
          </div>` : ""}
        </div>`;
    }).join("");

    // 自訂標籤（最近 30 天）
    const tagStats = {};
    ev30.forEach(e => (e.tags || []).forEach(t => {
      tagStats[t] = tagStats[t] || { p: 0, m: 0 };
      e.sign === 1 ? tagStats[t].p++ : tagStats[t].m++;
    }));
    const tagRows = Object.entries(tagStats)
      .sort((a, b) => (b[1].p + b[1].m) - (a[1].p + a[1].m))
      .map(([t, s]) => `
        <div class="bar-row" style="margin:8px 0">
          <div class="bar-label">
            <span class="tagpill" style="font-size:0.88rem">#${esc(t)}</span>
            <span class="ev-count"><span class="p">＋${s.p}</span> <span class="m">－${s.m}</span></span>
          </div>
        </div>`).join("");

    // 最常出現的不是 / 有點
    const lowCount = {};
    checks.slice(-4).forEach(e => Object.entries(e.answers || {}).forEach(([id, v]) => {
      if (v < 2) lowCount[id] = (lowCount[id] || 0) + (v === 0 ? 2 : 1);
    }));
    const lows = Object.entries(lowCount).sort((a, b) => b[1] - a[1]).slice(0, 3)
      .map(([id]) => STATEMENTS.find(s => s.id === id)).filter(Boolean);

    box.innerHTML = `
      <div class="card">
        <div class="stats">
          <div class="stat"><div class="n">${baseW !== null ? baseW : "-"}</div><div class="t">起點意願${base ? `<br>${esc(base.date)}` : "<br>尚未設定"}</div></div>
          <div class="stat"><div class="n">${recW !== null ? Math.round(recW) : "-"}</div><div class="t">最近 3 次意願</div><div class="d">${deltaHtml(recW, baseW)}</div></div>
          <div class="stat"><div class="n"><span style="color:var(--plus)">${p30}</span> : <span style="color:var(--minus)">${m30}</span></div><div class="t">30 天加分 : 扣分</div><div class="d">${ratioText(p30, m30)}</div></div>
        </div>
        ${baseRel !== null && recRel !== null ? `<p class="sub" style="margin:12px 0 0">關係分數：起點 ${Math.round(baseRel)}，最近 ${Math.round(recRel)} ${deltaHtml(recRel, baseRel)}</p>` : ""}
      </div>
      <div class="card">
        <h2>變化曲線</h2>
        ${chart}
      </div>
      <div class="card">
        <h2>各面向</h2>
        <p class="sub">長條和數字是最近 3 次檢查（0–100），橘色標記是起點；＋／－ 是最近 30 天記下的事件。</p>
        ${rows || `<div class="empty">還沒有資料</div>`}
      </div>
      ${tagRows ? `
      <div class="card">
        <h2>我的標籤</h2>
        <p class="sub">最近 30 天，各標籤記下的加分與扣分。</p>
        ${tagRows}
      </div>` : ""}
      ${lows.length ? `
      <div class="card">
        <h2>最近反覆出現的</h2>
        <p class="sub">最近幾次檢查中，最常回答「不是」或「有點」的。</p>
        <ul class="watch">${lows.map(s => `<li>${s.text}</li>`).join("")}</ul>
      </div>` : ""}`;
  }

  function renderAll() {
    renderRecent();
    renderCheckinHint();
    renderHistory();
    renderTrend();
  }

  // =========================================================
  // 分頁 / 遮罩 / 登入
  // =========================================================
  function switchTab(name) {
    document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
    ["event", "checkin", "history", "trend"].forEach(t => $(`tab-${t}`).classList.toggle("hidden", t !== name));
  }
  document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => switchTab(b.dataset.tab)));

  function toggleCover(force) {
    const show = force ?? coverEl.classList.contains("hidden");
    coverEl.classList.toggle("hidden", !show);
  }
  document.addEventListener("keydown", e => { if (e.key === "Escape" && auth.currentUser) toggleCover(); });
  coverEl.addEventListener("click", () => toggleCover(false));
  $("hideBtn").addEventListener("click", () => toggleCover(true));

  $("loginBtn").addEventListener("click", async () => {
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch (err) { console.error(err); toast("登入失敗：" + err.code); }
  });
  $("logoutBtn").addEventListener("click", () => signOut(auth));

  onAuthStateChanged(auth, user => {
    if (entriesUnsub) { entriesUnsub(); entriesUnsub = null; }
    if (tagsUnsub) { tagsUnsub(); tagsUnsub = null; }
    if (!user) {
      entries = [];
      customTags = [];
      appEl.classList.add("hidden");
      loginEl.classList.remove("hidden");
      coverEl.classList.add("hidden");
      return;
    }
    loginEl.classList.add("hidden");
    appEl.classList.remove("hidden");
    $("userName").textContent = user.displayName || user.email;
    if (user.photoURL) $("avatar").src = user.photoURL; else $("avatar").classList.add("hidden");

    tagsUnsub = onSnapshot(tagsRef(), snap => {
      customTags = snap.exists() ? (snap.data().list || []) : [];
      renderTagChips();
      renderHistory();
    }, err => console.error(err));

    const q = query(collection(db, "users", user.uid, "entries"), orderBy("date", "desc"));
    entriesUnsub = onSnapshot(q, snap => {
      entries = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderAll();
    }, err => {
      console.error(err);
      if (err.code === "permission-denied") {
        signOut(auth);
        toast("此帳號沒有權限");
      } else {
        toast("讀取失敗：" + err.code);
      }
    });
  });

  buildEventForm();
  buildTagUI();
  buildCheckinForm();
  resetEvent();
  resetCheckin();
</script>
</body>
</html>
